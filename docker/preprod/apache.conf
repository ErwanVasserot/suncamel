<Directory /var/www/html/public>
    AllowOverride None
    Options -Indexes +FollowSymLinks
    Require all granted
    FallbackResource /index.php
</Directory>

<Directory /var/www/html/public/assets>
    FallbackResource disabled
</Directory>

<Directory /var/www/html/public/images>
    FallbackResource disabled
</Directory>
